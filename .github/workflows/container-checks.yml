name: Container checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify containers without publication credentials
        run: |
          docker build --platform linux/amd64 -f Dockerfile.cluster --target v1 -t edu-v1:check .
          docker build --platform linux/amd64 -f Dockerfile.cluster --target v2 -t edu-v2:check .
          python3 docker/production/check.py edu-v1:check edu-v2:check
