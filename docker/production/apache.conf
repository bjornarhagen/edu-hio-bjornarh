ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    # Paths only: the historical registration form submits fields in its query.
    CustomLog /proc/self/fd/1 "%h %t \"%m %U %H\" %>s %b"
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Preserve the existing application paths and let ingress terminate HTTPS.
    RedirectMatch 302 ^/$ /phpsite/
    <FilesMatch "^(paameldinger\.dat|scores\.json)$">
        Require all denied
    </FilesMatch>
    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>
</VirtualHost>
