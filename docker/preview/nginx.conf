server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    location = /v1/lab/ { return 302 ${V1_ORIGIN}/phpsite/lab/; }
    location = / { return 302 /staticsite/; }
    # This existing PHP file only includes its neighbouring static index.html.
    location = /staticsite/webutvikling/2018/oblig-1/index.php {
        return 302 /staticsite/webutvikling/2018/oblig-1/index.html;
    }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ $uri.html =404; }
}
